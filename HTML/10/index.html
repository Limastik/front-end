<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Best Developers</title>
    <link rel="stylesheet" href="normalize.css" />
    <link rel="stylesheet" href="main.css" />
</head>

<body>
    <main>
        <h1><strong>Best Developers</strong> On The Planet</h1>
        <h3>This Product integrates with your favorite apps to automate workflows and ensure smooth, productive work
            days.</h3>
        <div class="developer-container">
            <div class="developer-category">
                <div class="developer-category-wrapper">
                    <h2 class="developer-category-name">Dan Burykin</h2>
                    <img class="developer-image-class" src="img/Dan_Burykin.png" alt="Dan Burykin">
                    <p class="developer-position">Vue.JS Developer</p>
                    <div class="technology-class">
                        <img src="img/VueJs.png" alt="VueJS">
                    </div>
                </div>
            </div>
            <div class="developer-category">
                <div class="developer-category-wrapper">
                    <h2 class="developer-category-name">Esi Doda</h2>
                    <img class="developer-image-class" src="img/Esi_Doda.png" alt="Esi Doda">
                    <p class="developer-position">Software Developer</p>
                    <div class="technology-class">
                        <img src="img/Angular.png" alt="Angular">
                        <img src="img/Flutter.png" alt="Flutter">
                        <img src="img/ReactJS.png" alt="ReactJS">
                    </div>
                </div>
            </div>
            <div class="developer-category">
                <div class="developer-category-wrapper">
                    <h2 class="developer-category-name">Alex Harper</h2>
                    <img class="developer-image-class" src="img/Alex_Harper.png" alt="Alex Harper">
                    <p class="developer-position">RN Executive</p>
                    <div class="technology-class">
                        <img src="img/Java.png" alt="Java">
                        <img src="img/ReactNative.png" alt="ReactNative">
                    </div>
                </div>
            </div>
            <div class="developer-category">
                <div class="developer-category-wrapper">
                    <h2 class="developer-category-name">Amarna Miller</h2>
                    <img class="developer-image-class" src="img/Amarna_Miller.png" alt="Amarna Miller">
                    <p class="developer-position">Frontend Wizard</p>
                    <div class="technology-class">
                        <img src="img/HTML.png" alt="HTML">
                        <img src="img/CSS.png" alt="CSS">
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer">
    </footer>
</body>

</html>
